name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        uv sync --extra test
    
    - name: Run unit tests
      run: |
        uv run pytest --cov=. --cov-report=xml --cov-report=html --cov-report=term --junitxml=junit-unit.xml
    
    - name: Generate test summary
      if: always()
      run: |
        echo "## Unit Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f junit-unit.xml ]; then
          tests_total=$(grep -o 'tests="[0-9]*"' junit-unit.xml | head -1 | grep -o '[0-9]*')
          tests_failed=$(grep -o 'failures="[0-9]*"' junit-unit.xml | head -1 | grep -o '[0-9]*')
          tests_errors=$(grep -o 'errors="[0-9]*"' junit-unit.xml | head -1 | grep -o '[0-9]*')
          tests_passed=$((tests_total - tests_failed - tests_errors))
          
          echo "- ✅ Passed: $tests_passed" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ Failed: $tests_failed" >> $GITHUB_STEP_SUMMARY
          echo "- ⚠️  Errors: $tests_errors" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 Total: $tests_total" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f coverage.xml ]; then
          coverage=$(grep -o 'line-rate="[0-9.]*"' coverage.xml | head -1 | grep -o '[0-9.]*' | awk '{printf "%.1f%%", $1 * 100}')
          echo "- 📈 Coverage: $coverage" >> $GITHUB_STEP_SUMMARY
        fi
    
    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: junit-unit.xml
        check_name: Unit Test Results
        comment_mode: off
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: always()
      with:
        file: ./coverage.xml
        flags: unit
        token: ${{ secrets.CODECOV_TOKEN }}
      continue-on-error: true
    
    - name: Coverage comment
      uses: py-cov-action/python-coverage-comment-action@v3
      if: github.event_name == 'pull_request'
      with:
        GITHUB_TOKEN: ${{ github.token }}
        MINIMUM_GREEN: 80
        MINIMUM_ORANGE: 60
      continue-on-error: true
    
    - name: Upload test results artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-results
        path: |
          junit-unit.xml
          coverage.xml
          htmlcov/
        retention-days: 30

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y debootstrap binutils fakeroot
    
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Install Python dependencies
      run: |
        uv sync --extra test
    
    - name: Run integration tests
      run: |
        uv run pytest tests/integration/ -v --cov=. --cov-report=xml --cov-report=term --junitxml=junit-integration.xml
    
    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: junit-integration.xml
        check_name: Integration Test Results
        comment_mode: off
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: always()
      with:
        file: ./coverage.xml
        flags: integration
        token: ${{ secrets.CODECOV_TOKEN }}
      continue-on-error: true
    
    - name: Upload test results artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results
        path: |
          junit-integration.xml
          coverage.xml
        retention-days: 30
    
    - name: Clean up test artifacts
      if: always()
      run: |
        sudo rm -rf /tmp/test_sysroot* || true

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Install ruff
      run: |
        uv tool install ruff
    
    - name: Run ruff check
      run: |
        uv tool run ruff check .
      continue-on-error: true
    
    - name: Run ruff format check
      run: |
        uv tool run ruff format --check .
      continue-on-error: true

  all-tests:
    name: All Tests (Combined)
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()
    permissions:
      checks: write
      pull-requests: write
    
    steps:
    - name: Download unit test results
      uses: actions/download-artifact@v4
      with:
        name: unit-test-results
        path: ./unit-results
      continue-on-error: true
    
    - name: Download integration test results
      uses: actions/download-artifact@v4
      with:
        name: integration-test-results
        path: ./integration-results
      continue-on-error: true
    
    - name: Publish combined test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: |
          ./unit-results/junit-*.xml
          ./integration-results/junit-*.xml
        check_name: All Test Results
        comment_title: Test Summary
    
    - name: Check test results
      run: |
        if [ "${{ needs.unit-tests.result }}" != "success" ] || [ "${{ needs.integration-tests.result }}" != "success" ]; then
          echo "❌ Tests failed"
          echo "Unit tests: ${{ needs.unit-tests.result }}"
          echo "Integration tests: ${{ needs.integration-tests.result }}"
          exit 1
        fi
        echo "✅ All tests passed!"
